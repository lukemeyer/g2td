<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Editor</title>
<!-- A dev tool, served by `npm run dev` at /tools/map-editor/ (on the LAN too) and never
     built into the app (docs/art.md). The map is drawn by the game's own
     renderer (src/render/map.ts) from the art pack, so what you see is what the game
     draws. Place and turn pieces, drag to lay rows (joining pieces join by themselves),
     paint floor tiles, draw walls; Save writes art/maps/<id>/layout.json and the game
     reloads with it. Works with a mouse or touch (pointer events). -->
<style>
  :root { --bg: #16181b; --panel: #202328; --line: #33373e; --text: #e4e6ea; --dim: #8b919b; --accent: #5ad17a; --sel: #ffd23f; --bad: #ff7a6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; overflow: hidden; -webkit-user-select: none; user-select: none; }
  header { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
  header h1 { font-size: 14px; margin: 0 4px 0 0; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; min-height: 32px; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.save { background: var(--accent); color: #0b1a10; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  label { color: var(--dim); display: inline-flex; gap: 4px; align-items: center; }
  #status { color: var(--dim); font-size: 12px; flex: 1 1 140px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 10px; }
  #board { flex: 0 0 auto; min-width: 0; }
  canvas#c { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 4px; touch-action: none; cursor: crosshair; }
  #panel { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .tabs button { padding: 4px 10px; min-height: 30px; }
  #grid { flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-content: flex-start; overflow-y: auto; }
  .item { text-align: center; font-size: 10px; color: var(--dim); cursor: pointer; touch-action: none; border-radius: 6px; padding: 3px; border: 1px solid transparent; }
  .item canvas { image-rendering: pixelated; background: rgb(3,17,3); border-radius: 4px; display: block; margin: 0 auto 2px; pointer-events: none; }
  .item.sel { border-color: var(--sel); color: var(--text); }
  .note { color: var(--dim); font-size: 12px; padding: 8px 10px; margin: 0; }
  @media (min-aspect-ratio: 3/2) { main { flex-direction: row; } #board { flex: 1 1 auto; max-width: 1152px; } #panel { flex: 0 0 300px; } }
  @media (max-aspect-ratio: 3/2) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
  <h1>Map Editor</h1>
  <select id="map"></select>
  <span class="seg">
    <button id="mode-pieces" class="on">Pieces</button><button id="mode-floor">Floor</button><button id="mode-walls">Walls</button><button id="mode-erase">Eraser</button>
  </span>
  <button id="rotate" disabled title="Turn the stamp or the selected piece (R; Shift+R the other way)">⟳ Turn</button>
  <button id="variant" disabled title="Next variant of the stamp or the selected piece (V; Shift+V the other way)">◇ Variant</button>
  <button id="remove" disabled title="Remove the selected piece (Delete)">✕ Remove</button>
  <button id="save" class="save">Save</button>
  <label title="The slot corners, and the strips of the cells beside the road that the road walls run over"><input id="guides" type="checkbox" checked> guides</label>
  <span id="status"></span>
</header>
<main>
  <div id="board"><canvas id="c" width="1152" height="576"></canvas></div>
  <section id="panel">
    <div class="tabs" id="tabs"></div>
    <div id="grid"></div>
  </section>
</main>
<script type="module">
import { MAPS, useMap, SLOTS, ROAD, HUD_BOX, MAP, COLS, ROWS, CH, X, key } from "/src/rules.ts";
import { PACK } from "/src/pack.ts";
import { drawMap, footprint, boxOf, xOf, artOf, piecesFor, artFor, FIRST_COL, LAST_COL, cellKey, roadMargins } from "/src/render/map.ts";

const S = 2, $ = (id) => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/** The map being edited: its layout (version 2), what the palette offers, the tool. */
let layout, mapId, mode = "pieces", stamp = null, selected = null, brush = null, tab = "pieces", dirty = false, hover = null;
/** The palette's filter: "all", "shared" (pieces with no map of their own) or a map id. Kept per browser. */
let only = (() => { try { return localStorage.getItem("editor.only") || "all"; } catch { return "all"; } })();

for (const [i, m] of MAPS.entries()) $("map").append(new Option(m.name, String(i)));
$("map").onchange = () => {
    if (dirty && !confirm("Leave this map without saving? Its unsaved changes are lost.")) { $("map").value = String(MAPS.findIndex((m) => m.id === mapId)); return; }
    load(+$("map").value);
};
const status = (t) => ($("status").textContent = t);
const mark = (t = "unsaved changes") => { dirty = true; status(t); draw(); };
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

const blocked = new Set();      // cells nothing may stand on (cellKey): road, HUD box, the boss and the row of its arm's bar
const ck = ([r, c]) => cellKey(r, c);
const inCols = (c) => c >= FIRST_COL && c <= LAST_COL;
const onRoad = (r, c) => c >= 0 && c < COLS && ROAD.has(key([r, c]));
async function load(i) {
    useMap(i);
    mapId = MAP.id;
    history.replaceState(null, "", `?map=${mapId}`);
    blocked.clear();
    for (const k of ROAD) blocked.add(cellKey(Math.floor(k / COLS), k % COLS));
    for (const cell of roadMargins()) blocked.add(ck(cell));
    // the HUD box runs on to the screen's right edge, over the margin column too
    for (let r = 0; r < HUD_BOX.rows; r++) for (let c = HUD_BOX.col; c <= LAST_COL; c++) blocked.add(cellKey(HUD_BOX.row + r, c));
    if (MAP.boss) { const [[r0, c0], [r1, c1]] = MAP.boss.cells; for (let r = r0 - 1; r <= r1; r++) for (let c = c0; c <= c1; c++) blocked.add(cellKey(r, c)); }
    const got = await fetch(`/art/maps/${mapId}/layout.json?t=${Date.now()}`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    layout = got?.version === 2 ? got : { version: 2, floor: { legend: {}, rows: [] }, pieces: [], walls: [] };
    layout.floor ??= { legend: {}, rows: [] };
    // rows start at the left margin column (layouts saved before started at column 0)
    const from = layout.floor.from ?? 0;
    if (from !== FIRST_COL) { layout.floor.rows = layout.floor.rows.map((row) => (row ? ".".repeat(from - FIRST_COL) + row : row)); layout.floor.from = FIRST_COL; }
    stamp = selected = null; brush = artFor(mapId)?.floor ?? null; dirty = false;
    status(`${layout.pieces.length} pieces, ${layout.walls.length} walls`);
    panel(); tools(); draw();
}

// --- cells and what stands on them -------------------------------------------------------
const def = (id) => PACK.pieces[id];
const isDecal = (id) => !!def(id)?.decal;
/** Cell -> index of the piece on it, decals and the rest apart (a decal may lie under a piece). */
function cover(decals) {
    const m = new Map();
    layout.pieces.forEach((p, i) => { if (def(p[2]) && isDecal(p[2]) === decals) for (const [r, c] of footprint(def(p[2]), p[0], p[1], p[4])) m.set(cellKey(r, c), i); });
    return m;
}
function fits(r, c, id, q, except = -1) {
    const d = def(id);
    if (!d) return false;
    const cov = cover(isDecal(id));
    return footprint(d, r, c, q).every(([rr, cc]) => rr >= 0 && rr < ROWS && inCols(cc) && !blocked.has(cellKey(rr, cc)) && (!cov.has(cellKey(rr, cc)) || cov.get(cellKey(rr, cc)) === except));
}
/** The piece under a cell: a piece before a decal. */
const pieceAt = (r, c) => cover(false).get(cellKey(r, c)) ?? cover(true).get(cellKey(r, c));

// --- the pointer -----------------------------------------------------------------------
function at(ev) {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * (cv.width / b.width) / S, (ev.clientY - b.top) * (cv.height / b.height) / S];
}
function cellAt(ev) {
    const [x, y] = at(ev);
    const r = Math.floor((y - 4 + 3) / CH), c = Math.floor((x - xOf(0) + 2) / 25);
    return r >= 0 && r < ROWS && inCols(c) ? [r, c] : null;
}
/** The wall edge nearest the pointer, [r, c, side] (e/s, w/n only on the map's edges). */
function edgeAt(ev) {
    const [x, y] = at(ev);
    let best = null, d = 1e9;
    for (let r = 0; r < ROWS; r++) for (let c = FIRST_COL; c <= LAST_COL; c++) {
        const cx = xOf(c) + 10, cy = r * CH + 14;
        for (const [ex, ey, side, ok] of [[xOf(c) + 22, cy, "e", true], [cx, r * CH + 27, "s", true], [xOf(c) - 3, cy, "w", c === FIRST_COL], [cx, r * CH + 1, "n", r === 0]]) {
            if (!ok) continue;
            const dd = Math.hypot(ex - x, ey - y);
            if (dd < d) { d = dd; best = [r, c, side]; }
        }
    }
    return d < (ev.pointerType === "touch" ? 12 : 9) ? best : null;
}

let drag = null;
cv.addEventListener("pointerdown", (e) => {
    try { cv.setPointerCapture(e.pointerId); } catch { /* not live */ }
    const cell = cellAt(e);
    if (mode === "walls") { drag = { kind: "walls", done: new Set() }; wallAt(e); return; }
    if (mode === "erase") { drag = { kind: "erase" }; erase(e); return; }
    if (mode === "floor") { if (cell) { drag = { kind: "paint" }; paint(cell); } return; }
    if (!cell) return;
    const i = pieceAt(...cell);
    if (stamp) { drag = { kind: "stamp", done: new Set() }; stampAt(cell); return; }
    if (i !== undefined) { const p = layout.pieces[i]; selected = i; drag = { kind: "move", i, off: [cell[0] - p[0], cell[1] - p[1]], moved: false }; tools(); draw(); return; }
    selected = null; tools(); draw();
});
cv.addEventListener("pointermove", (e) => {
    const cell = cellAt(e);
    const k = cell ? cell.join() : null;
    if (k !== hover?.join()) { hover = cell; if (!drag) draw(); }
    if (!drag) return;
    if (drag.kind === "walls") wallAt(e);
    else if (drag.kind === "erase") erase(e);
    else if (drag.kind === "paint" && cell) paint(cell);
    else if (drag.kind === "stamp" && cell) stampAt(cell);
    else if (drag.kind === "move" && cell) {
        const p = layout.pieces[drag.i], to = [cell[0] - drag.off[0], cell[1] - drag.off[1]];
        if ((to[0] !== p[0] || to[1] !== p[1]) && fits(to[0], to[1], p[2], p[4], drag.i)) { p[0] = to[0]; p[1] = to[1]; drag.moved = true; mark(); }
    }
});
cv.addEventListener("pointerup", () => { drag = null; draw(); });
cv.addEventListener("pointerleave", () => { hover = null; if (!drag) draw(); });

function stampAt(cell) {
    if (drag.done.has(cell.join())) return;
    drag.done.add(cell.join());
    if (!fits(cell[0], cell[1], stamp.id, stamp.q)) return;
    layout.pieces.push([cell[0], cell[1], stamp.id, stamp.v, stamp.q]);
    mark(`placed ${stamp.id}; tap the palette piece again to stop`);
}
function paint(cell) {
    const [r, c] = cell, f = layout.floor;
    while (f.rows.length < ROWS) f.rows.push("");
    let ch = ".";
    if (brush && brush !== artFor(mapId)?.floor) {
        ch = Object.keys(f.legend).find((k) => f.legend[k] === brush);
        if (!ch) { ch = "abcdefghijklmnopqrstuvwxyz".split("").find((k) => !f.legend[k]); f.legend[ch] = brush; }
    }
    const row = f.rows[r].padEnd(c - FIRST_COL + 1, ".").split("");
    if (row[c - FIRST_COL] === ch) return;
    row[c - FIRST_COL] = ch; f.rows[r] = row.join("").replace(/\.+$/, "");
    mark();
}
function wallAt(e) {
    const ed = edgeAt(e);
    if (!ed || drag.done.has(ed.join())) return;
    drag.done.add(ed.join());
    const i = layout.walls.findIndex((w) => w.join() === ed.join());
    if (i >= 0) layout.walls.splice(i, 1); else layout.walls.push(ed);
    mark();
}
function erase(e) {
    const ed = edgeAt(e);
    if (ed) { const i = layout.walls.findIndex((w) => w.join() === ed.join()); if (i >= 0) { layout.walls.splice(i, 1); mark(); return; } }
    const cell = cellAt(e);
    if (!cell) return;
    const i = pieceAt(...cell);
    if (i !== undefined) { layout.pieces.splice(i, 1); selected = null; tools(); mark(); }
}
function turn(back) {
    const d = back ? 3 : 1;
    if (selected !== null && layout.pieces[selected]) {
        const p = layout.pieces[selected], q = (p[4] + d) % 4;
        if (fits(p[0], p[1], p[2], q, selected)) { p[4] = q; mark(); } else status("no room to turn it there");
    } else if (stamp) { stamp.q = (stamp.q + d) % 4; status(`stamp turned ${stamp.q * 90}°`); draw(); }
}
const variants = (id) => Math.max(...Object.values(def(id).parts).map((a) => a.length));
function vary(back) {
    const p = selected !== null ? layout.pieces[selected] : null, id = p ? p[2] : stamp?.id;
    if (!id) return;
    const n = variants(id), d = back ? n - 1 : 1;
    if (n < 2) { status(`${id} has one variant`); return; }
    if (p) { p[3] = (p[3] + d) % n; mark(`${id} variant ${p[3] + 1}/${n}; unsaved changes`); }
    else { stamp.v = (stamp.v + d) % n; status(`stamp: ${id} variant ${stamp.v + 1}/${n}`); panel(); draw(); }
}
function removeSelected() { if (selected !== null && layout.pieces[selected]) { layout.pieces.splice(selected, 1); selected = null; tools(); mark(); } }
function tools() {
    $("rotate").disabled = !(stamp || selected !== null) || mode !== "pieces";
    $("variant").disabled = !(stamp || selected !== null) || mode !== "pieces";
    $("remove").disabled = selected === null || mode !== "pieces";
}
$("rotate").onclick = () => turn(false);
$("variant").onclick = () => vary(false);
$("remove").onclick = removeSelected;
addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "v" || e.key === "V") vary(e.shiftKey);
    if (e.key === "r" || e.key === "R") turn(e.shiftKey);
    if (e.key === "Delete" || e.key === "Backspace") removeSelected();
    if (e.key === "Escape") { stamp = null; selected = null; panel(); tools(); draw(); status(""); }
    if ((e.key === "e" || e.key === "E") && !e.metaKey) setMode(mode === "erase" ? "pieces" : "erase");
});
$("guides").onchange = () => draw();

// --- drawing ---------------------------------------------------------------------------
const green = (v) => { const g = v * 17, rb = Math.floor(g * 22 / 100); return [rb, g, rb]; };
const img = ctx.createImageData(576, 288);
const off = new OffscreenCanvas(576, 288), offCtx = off.getContext("2d");
function draw() {
    if (!layout) return;
    // the stamp under the pointer, drawn by the renderer like a placed piece
    let pieces = layout.pieces;
    if (stamp && hover && mode === "pieces" && !drag && fits(hover[0], hover[1], stamp.id, stamp.q)) pieces = [...pieces, [hover[0], hover[1], stamp.id, stamp.v, stamp.q]];
    const px = drawMap(mapId, { ...layout, pieces });
    for (let i = 0; i < px.length; i++) { const [r, g, b] = green(px[i]); img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255; }
    offCtx.putImageData(img, 0, 0);
    ctx.drawImage(off, 0, 0, 1152, 576);
    // the HUD box, dark as in the game
    ctx.fillStyle = "#000"; ctx.fillRect(X[HUD_BOX.col] * S, 0, (576 - X[HUD_BOX.col]) * S, (2 * CH + 2) * S);
    if ($("guides").checked) {
        // the strips of the cells beside the road that the road walls run over: what of the
        // kit's width the gap (5 px across, 7 down) doesn't hold
        ctx.fillStyle = "rgba(255,120,100,.28)";
        const width = (PACK.roads[artFor(mapId)?.road] ?? Object.values(PACK.roads)[0])?.width ?? 0;
        const sx = Math.max(0, width - 5), sy = Math.max(0, width - 7);
        const road = (r, c) => onRoad(r, c) || roadMargins().some((m) => m[0] === r && m[1] === c);
        for (let r = 0; r < ROWS; r++) for (let c = FIRST_COL; c <= LAST_COL; c++) {
            if (blocked.has(cellKey(r, c))) continue;
            const x = xOf(c), y = r * CH + 4;
            if (sx && road(r, c - 1)) ctx.fillRect(x * S, y * S, sx * S, 20 * S);
            if (sx && road(r, c + 1)) ctx.fillRect((x + 20 - sx) * S, y * S, sx * S, 20 * S);
            if (sy && road(r - 1, c)) ctx.fillRect(x * S, y * S, 20 * S, sy * S);
            if (sy && road(r + 1, c)) ctx.fillRect(x * S, (y + 20 - sy) * S, 20 * S, sy * S);
        }
        // the tower slots' corners
        ctx.strokeStyle = "#9cff9c"; ctx.lineWidth = 2;
        for (const s of SLOTS) for (const [r, c] of s.cells) {
            const x = xOf(c) * S, y = (r * CH + 4) * S, w = 20 * S, a = 6 * S;
            for (const [sx, sy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + w, 1, -1], [x + w, y + w, -1, -1]]) {
                ctx.beginPath(); ctx.moveTo(sx + dx * a, sy); ctx.lineTo(sx, sy); ctx.lineTo(sx, sy + dy * a); ctx.stroke();
            }
        }
    }
    if (selected !== null && layout.pieces[selected]) {
        const p = layout.pieces[selected], [x0, y0, x1, y1] = boxOf(footprint(def(p[2]), p[0], p[1], p[4]));
        ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 3; ctx.strokeRect(x0 * S - 3, y0 * S - 3, (x1 - x0 + 1) * S + 6, (y1 - y0 + 1) * S + 6);
        // which way it faces: its front strip's side
        const [cx, cy] = [(x0 + x1 + 1) / 2 * S, (y0 + y1 + 1) / 2 * S], d = [[0, 1], [-1, 0], [0, -1], [1, 0]][p[4] % 4];
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + d[0] * 14, cy + d[1] * 14); ctx.stroke();
    }
    if (hover && (mode === "floor" || (mode === "pieces" && !stamp))) {
        ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
        ctx.strokeRect(xOf(hover[1]) * S, (hover[0] * CH + 4) * S, 20 * S, 20 * S);
    }
}

// --- the palette -------------------------------------------------------------------------
/** A pack picture on a small canvas, `z` px a pixel. */
function thumb(pic, z, turns = 0) {
    const a = artOf(pic, turns), c = document.createElement("canvas");
    c.width = a.w * z; c.height = a.h * z;
    const x = c.getContext("2d");
    for (let y = 0; y < a.h; y++) for (let xx = 0; xx < a.w; xx++) {
        const v = a.px[y * a.w + xx];
        if (v === 255) continue;
        const [r, g, b] = green(v); x.fillStyle = `rgb(${r},${g},${b})`; x.fillRect(xx * z, y * z, z, z);
    }
    return c;
}
const firstPart = (d, v = 0) => { const a = d.parts.body ?? d.parts.alone ?? d.parts.gss ?? d.parts.dot ?? Object.values(d.parts)[0]; return a[v % a.length]; };
function panel() {
    const tabs = $("tabs"), grid = $("grid");
    tabs.innerHTML = ""; grid.innerHTML = "";
    if (mode === "floor") {
        const floors = artFor(mapId)?.floors ?? Object.keys(PACK.floors);
        for (const id of floors) {
            const f = PACK.floors[id];
            if (!f) continue;
            const d = document.createElement("div"); d.className = "item" + (brush === id ? " sel" : "");
            d.append(thumb(f.tile[0], 3)); d.append(id + (id === artFor(mapId)?.floor ? " (the map's)" : ""));
            d.onclick = () => { brush = id; panel(); };
            grid.append(d);
        }
        grid.insertAdjacentHTML("beforeend", `<p class="note">Tap or drag over cells to paint their floor. The map's own floor is what every unpainted cell has.</p>`);
        return;
    }
    if (mode !== "pieces") {
        grid.innerHTML = mode === "walls" ? `<p class="note">Tap a gap between two cells to add or remove a wall; drag along gaps to draw several.</p>`
            : `<p class="note">Tap or drag over pieces and walls to remove them. E toggles the eraser.</p>`;
        return;
    }
    const owner = (id) => def(id).maps?.find((m) => m !== "all") ?? "shared";
    const pick = document.createElement("select");
    pick.title = "Show the shared pieces or one map's own";
    pick.append(new Option("all maps", "all"), new Option("shared", "shared"), ...MAPS.filter((m) => !m.random).map((m) => new Option(m.name, m.id)));
    pick.value = only; if (pick.value !== only) pick.value = only = "all";
    pick.onchange = () => { only = pick.value; try { localStorage.setItem("editor.only", only); } catch {} panel(); };
    tabs.append(pick);
    const ids = piecesFor(mapId).filter((id) => only === "all" || owner(id) === only);
    const groups = { pieces: ids.filter((id) => !def(id).decal), decals: ids.filter((id) => def(id).decal) };
    for (const name of Object.keys(groups)) {
        const b = document.createElement("button"); b.textContent = `${name} (${groups[name].length})`;
        b.className = name === tab ? "on" : ""; b.onclick = () => { tab = name; panel(); };
        tabs.append(b);
    }
    // one item per variant (every picture picked for a piece is a variant)
    for (const id of groups[tab]) for (let v = 0, n = variants(id); v < n; v++) {
        const d = def(id), item = document.createElement("div");
        item.className = "item" + (stamp?.id === id && stamp.v === v ? " sel" : "");
        item.append(thumb(firstPart(d, v), 3)); item.append(`${id}${n > 1 ? ` ${v + 1}/${n}` : ""} ${d.size[0]}x${d.size[1]}${d.joins !== "none" ? " · " + d.joins : ""}`);
        item.onclick = () => {
            stamp = stamp?.id === id && stamp.v === v ? null : { id, v, q: stamp?.id === id ? stamp.q : 0 }; selected = null;
            status(stamp ? `tap or drag over cells to place ${id}; R turns it; tap it again to stop` : "");
            panel(); tools(); draw();
        };
        grid.append(item);
    }
    if (!groups[tab].length) grid.innerHTML = `<p class="note">The art pack has no ${tab} for this map${only === "all" ? "" : " under this filter"} yet.</p>`;
}

function setMode(m) {
    mode = m; stamp = null; selected = null;
    for (const n of ["pieces", "floor", "walls", "erase"]) $(`mode-${n}`).classList.toggle("on", m === n);
    cv.style.cursor = m === "erase" ? "cell" : "crosshair";
    panel(); tools(); draw();
}
for (const n of ["pieces", "floor", "walls", "erase"]) $(`mode-${n}`).onclick = () => setMode(n);

$("save").onclick = async () => {
    $("save").disabled = true; status("saving…");
    try {
        const r = await fetch("/__editor/save", { method: "POST", body: JSON.stringify({ id: mapId, layout }) });
        const out = await r.json();
        if (!out.ok) throw new Error(out.error);
        dirty = false; status("saved: the game reloads with it");
    } catch (e) { status("save failed: " + e.message); }
    $("save").disabled = false;
};

const want = new URLSearchParams(location.search).get("map");
const start = Math.max(0, MAPS.findIndex((m) => m.id === want));
$("map").value = String(start);
await load(start);
</script>
</body>
</html>
